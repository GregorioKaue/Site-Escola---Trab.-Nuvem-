<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | EduConnect</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <style>
    :root {
      --primary: #2457d6;
      --bg: #f4f7fc;
    }

    body {
      background: var(--bg);
      font-family: Arial, sans-serif;
      color: #202b40;
    }

    .navbar {
      background: #fff;
    }

    .brand {
      color: var(--primary);
      font-size: 1.4rem;
      font-weight: 800;
    }

    .login-wrapper {
      min-height: calc(100vh - 140px);
    }

    .login-card {
      border: 0;
      border-radius: 20px;
      box-shadow: 0 10px 25px #243b6520;
      overflow: hidden;
    }

    .login-header {
      background: linear-gradient(120deg, #2457d6, #6489f0);
      color: white;
      padding: 28px 32px;
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 .2rem #2457d630;
    }

    .link-primary-custom {
      color: var(--primary);
      text-decoration: none;
    }

    .link-primary-custom:hover {
      text-decoration: underline;
    }

    footer {
      color: #68758a;
    }
  </style>
</head>

<body>
<nav class="navbar shadow-sm sticky-top">
  <div class="container">
    <!-- Logo também leva à página inicial -->
    <a class="navbar-brand brand" href="../index.html">EduConnect</a>
  </div>
</nav>

<main class="container py-4 login-wrapper d-flex align-items-center justify-content-center">
  <div class="card login-card w-100" style="max-width: 440px;">
    <div class="login-header">
      <h1 class="h3 fw-bold mb-1">Entrar</h1>
      <p class="mb-0">Acesse sua conta do portal escolar.</p>
    </div>

    <div class="card-body p-4">
      <!-- Aviso exibido quando e-mail ou senha estão incorretos -->
      <div id="erroLogin" class="alert alert-danger" hidden>
        E-mail ou senha incorretos.
      </div>

      <form id="formLogin" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">E-mail</label>
          <input type="email" id="email" class="form-control form-control-lg"
            placeholder="seuemail@escola.com.br"
            autocomplete="username" required>
          <div class="invalid-feedback">Informe um e-mail válido.</div>
        </div>

        <div class="mb-2">
          <label for="senha" class="form-label fw-semibold">Senha</label>
          <input type="password" id="senha"
            class="form-control form-control-lg"
            placeholder="Digite sua senha"
            autocomplete="current-password" required>
          <div class="invalid-feedback">Informe sua senha.</div>
        </div>

        <div class="d-flex justify-content-between flex-wrap gap-2 mb-4">
          <!-- Abre a página de recuperação de senha -->
          <a href="esqueci-senha.html" class="link-primary-custom small">Esqueci minha senha</a>

          <!-- Volta para a página index.html (pasta acima de "pages") -->
          <a href="../index.html" id="linkVoltar"
            class="link-primary-custom small">Voltar</a>
        </div>

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
          <button type="button" id="btnLimpar"
            class="btn btn-outline-secondary">Limpar</button>
        </div>
      </form>
    </div>
  </div>
</main>

<footer class="container text-center py-4">
  EduConnect © 2026 — Portal Digital Escolar
</footer>

<script>
  const form = document.getElementById("formLogin");
  const email = document.getElementById("email");
  const senha = document.getElementById("senha");

  // Valida os campos e acessa o sistema.
  form.addEventListener("submit", evento => {
    evento.preventDefault();

    const emailValido = email.checkValidity() && email.value.trim() !== "";
    const senhaValida = senha.value.trim() !== "";

    email.classList.toggle("is-invalid", !emailValido);
    senha.classList.toggle("is-invalid", !senhaValida);

    if (!emailValido || !senhaValida) return;

    // Usuário de demonstração. Em um sistema real, a conferência
    // seria feita no servidor da escola.
    const usuarioDemo = {
      email: "aluno@escola.com.br",   // E-mail correto
      senha: "123456",                // Senha correta
      nome: "Maria Souza",            // Nome exibido no perfil
      turma: "8º Ano B",              // Turma exibida no perfil
      matricula: "2026-0142"          // Matrícula exibida no perfil
    };

    const erro = document.getElementById("erroLogin"); // Aviso de erro

    // Compara o que foi digitado com os dados corretos.
    if (email.value.trim().toLowerCase() === usuarioDemo.email &&
        senha.value === usuarioDemo.senha) {
      erro.hidden = true; // Esconde o aviso de erro
      // Guarda os dados do usuário (sem a senha) na sessão do navegador.
      sessionStorage.setItem("usuarioLogado", JSON.stringify({
        email: usuarioDemo.email,
        nome: usuarioDemo.nome,
        turma: usuarioDemo.turma,
        matricula: usuarioDemo.matricula
      }));
      window.location.href = "perfil.html"; // Abre a página de perfil
    } else {
      erro.hidden = false; // Mostra "E-mail ou senha incorretos"
      senha.value = "";    // Limpa a senha digitada
      senha.focus();       // Coloca o cursor no campo de senha
    }
  });

  // Apaga os dois campos e remove os avisos de erro.
  document.getElementById("btnLimpar").addEventListener("click", () => {
    email.value = "";
    senha.value = "";
    email.classList.remove("is-invalid");
    senha.classList.remove("is-invalid");
    email.focus();
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
