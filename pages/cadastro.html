<!DOCTYPE html> <!-- Declara que o documento usa HTML5 -->
<html lang="pt-BR"> <!-- Abre o documento e define o idioma como português do Brasil -->
<head> <!-- Abre o cabeçalho com configurações da página -->
  <meta charset="UTF-8"> <!-- Define a codificação de caracteres (acentos funcionam corretamente) -->
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Faz a página se adaptar a telas de celular -->
  <title>Criar conta | EduConnect</title> <!-- Título exibido na aba do navegador -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> <!-- Carrega o CSS do Bootstrap -->
  <style> <!-- Abre o bloco de estilos personalizados -->
    :root { --primary: #2457d6; --bg: #f4f7fc; } /* Define as variáveis de cor: azul principal e fundo claro */
    body { background: var(--bg); font-family: Arial, sans-serif; color: #202b40; } /* Aplica fundo, fonte e cor do texto na página */
    .navbar { background: #fff; } /* Deixa a barra superior com fundo branco */
    .brand { color: var(--primary); font-size: 1.4rem; font-weight: 800; } /* Estiliza o nome EduConnect na barra: azul, grande e em negrito */
    .login-wrapper { min-height: calc(100vh - 140px); } /* Garante altura mínima para centralizar o cartão verticalmente */
    .login-card { border: 0; border-radius: 20px; box-shadow: 0 10px 25px #243b6520; overflow: hidden; } /* Cartão sem borda, cantos arredondados e sombra suave */
    .login-header { background: linear-gradient(120deg, #2457d6, #6489f0); color: #fff; padding: 28px 32px; } /* Cabeçalho do cartão com degradê azul e texto branco */
    .form-control:focus, .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 .2rem #2457d630; } /* Destaca em azul o campo que está em foco */
    .nav-pills .nav-link { color: var(--primary); font-weight: 600; } /* Cor e peso do texto das abas (aluno/professor) */
    .nav-pills .nav-link.active { background: var(--primary); color: #fff; } /* Aba ativa com fundo azul e texto branco */
    .link-primary-custom { color: var(--primary); text-decoration: none; } /* Links na cor azul e sem sublinhado */
    .link-primary-custom:hover { text-decoration: underline; } /* Sublinha o link quando o mouse passa sobre ele */
    footer { color: #68758a; } /* Cor cinza do texto do rodapé */
  </style> <!-- Fecha o bloco de estilos -->
</head> <!-- Fecha o cabeçalho -->
<body> <!-- Abre o corpo visível da página -->
<nav class="navbar shadow-sm sticky-top"> <!-- Barra superior fixa no topo com leve sombra -->
  <div class="container"><a class="navbar-brand brand" href="../index.html">EduConnect</a></div> <!-- Logo/nome do portal que leva à página inicial -->
</nav> <!-- Fecha a barra superior -->

<main class="container py-4 login-wrapper d-flex align-items-center justify-content-center"> <!-- Área principal que centraliza o cartão na tela -->
  <div class="card login-card w-100" style="max-width: 560px;"> <!-- Cartão do formulário com largura máxima de 560px -->
    <div class="login-header"> <!-- Faixa azul do topo do cartão -->
      <h1 class="h3 fw-bold mb-1">Criar conta</h1> <!-- Título principal da página -->
      <p class="mb-0">Cadastre-se para acessar o portal escolar.</p> <!-- Texto de apoio abaixo do título -->
    </div> <!-- Fecha a faixa azul -->

    <div class="card-body p-4"> <!-- Corpo do cartão com espaçamento interno -->
      <ul class="nav nav-pills nav-fill mb-4" role="tablist" aria-label="Tipo de conta"> <!-- Lista de abas para escolher o tipo de conta -->
        <li class="nav-item"><button type="button" class="nav-link active" id="tabAluno" data-tipo="aluno">Sou aluno</button></li> <!-- Aba do aluno (começa ativa) -->
        <li class="nav-item"><button type="button" class="nav-link" id="tabProfessor" data-tipo="professor">Sou professor</button></li> <!-- Aba do professor -->
      </ul> <!-- Fecha a lista de abas -->

      <div id="mensagem" class="alert" role="status" aria-live="polite" hidden></div> <!-- Caixa de mensagens de sucesso/erro (começa oculta) -->

      <form id="formCadastro" novalidate> <!-- Formulário de cadastro; novalidate desativa a validação padrão do navegador -->
        <div class="mb-3"> <!-- Bloco do campo Nome com margem inferior -->
          <label for="nome" class="form-label fw-semibold">Nome completo</label> <!-- Rótulo do campo nome -->
          <input type="text" id="nome" class="form-control form-control-lg" maxlength="120" autocomplete="name" required> <!-- Campo de texto do nome (até 120 caracteres) -->
          <div class="invalid-feedback">Informe seu nome completo.</div> <!-- Mensagem exibida se o nome for inválido -->
        </div> <!-- Fecha o bloco do nome -->

        <div class="mb-3"> <!-- Bloco do campo E-mail, agora em largura total igual ao nome -->
          <label for="email" class="form-label fw-semibold">E-mail</label> <!-- Rótulo do campo e-mail -->
          <input type="email" id="email" class="form-control form-control-lg" placeholder="seuemail@escola.com.br" maxlength="150" autocomplete="email" required> <!-- Campo de e-mail com exemplo de preenchimento -->
          <div class="invalid-feedback">Informe um e-mail válido.</div> <!-- Mensagem exibida se o e-mail for inválido -->
        </div> <!-- Fecha o bloco do e-mail -->

        <div id="camposAluno" class="mb-3"> <!-- Bloco com os campos exclusivos do aluno -->
          <label for="turma" class="form-label fw-semibold">Turma</label> <!-- Rótulo do campo turma -->
          <input type="text" id="turma" class="form-control form-control-lg" placeholder="Ex.: 7º A" maxlength="30"> <!-- Campo de texto da turma -->
          <div class="invalid-feedback">Informe sua turma.</div> <!-- Mensagem exibida se a turma estiver vazia -->
        </div> <!-- Fecha o bloco do aluno -->

        <div id="camposProfessor" class="mb-3" hidden> <!-- Bloco com os campos exclusivos do professor (começa oculto) -->
          <label for="disciplina" class="form-label fw-semibold">Disciplina</label> <!-- Rótulo do campo disciplina -->
          <input type="text" id="disciplina" class="form-control form-control-lg" placeholder="Ex.: Matemática" maxlength="80"> <!-- Campo de texto da disciplina -->
          <div class="invalid-feedback">Informe a disciplina.</div> <!-- Mensagem exibida se a disciplina estiver vazia -->
        </div> <!-- Fecha o bloco do professor -->

        <div class="row g-3 mb-4"> <!-- Linha com duas colunas para as senhas -->
          <div class="col-md-6"> <!-- Coluna da senha (metade da largura em telas médias ou maiores) -->
            <label for="senha" class="form-label fw-semibold">Senha</label> <!-- Rótulo do campo senha -->
            <input type="password" id="senha" class="form-control form-control-lg" placeholder="Mínimo de 8 caracteres" minlength="8" maxlength="72" autocomplete="new-password" required> <!-- Campo de senha (8 a 72 caracteres) -->
            <div class="invalid-feedback">A senha deve ter de 8 a 72 caracteres.</div> <!-- Mensagem exibida se a senha for inválida -->
          </div> <!-- Fecha a coluna da senha -->
          <div class="col-md-6"> <!-- Coluna da confirmação de senha -->
            <label for="confirmarSenha" class="form-label fw-semibold">Confirmar senha</label> <!-- Rótulo do campo de confirmação -->
            <input type="password" id="confirmarSenha" class="form-control form-control-lg" placeholder="Repita a senha" maxlength="72" autocomplete="new-password" required> <!-- Campo para repetir a senha -->
            <div class="invalid-feedback">As senhas não conferem.</div> <!-- Mensagem exibida se as senhas forem diferentes -->
          </div> <!-- Fecha a coluna da confirmação -->
        </div> <!-- Fecha a linha das senhas -->

        <div class="d-grid gap-2"> <!-- Grupo de botões, um embaixo do outro, ocupando toda a largura -->
          <button type="submit" class="btn btn-primary btn-lg">Criar conta</button> <!-- Botão que envia o cadastro (visível para aluno e professor) -->
          <button type="button" id="btnLimpar" class="btn btn-outline-secondary">Limpar</button> <!-- Botão que limpa todos os campos -->
        </div> <!-- Fecha o grupo de botões -->
      </form> <!-- Fecha o formulário -->

      <p class="text-center small mt-4 mb-0"> <!-- Parágrafo centralizado com o link para login -->
        Já tem conta? <!-- Texto informativo -->
        <a href="login.html" id="linkLogin" class="link-primary-custom">Entrar</a> <!-- Link para a tela de login (o destino muda conforme o tipo de conta) -->
      </p> <!-- Fecha o parágrafo -->
    </div> <!-- Fecha o corpo do cartão -->
  </div> <!-- Fecha o cartão -->
</main> <!-- Fecha a área principal -->

<footer class="container text-center py-4">EduConnect © 2026 — Portal Digital Escolar</footer> <!-- Rodapé com direitos autorais -->

<script src="api.js"></script> <!-- Carrega o arquivo que contém o objeto EduAPI (comunicação com o servidor) -->
<script> <!-- Abre o script principal da página -->
  const $ = id => document.getElementById(id); // Atalho: $("x") busca o elemento que tem id="x"
  const form = $("formCadastro"), msg = $("mensagem"); // Guarda o formulário e a caixa de mensagens em variáveis
  let tipo = "aluno"; // Guarda o tipo de conta selecionado; começa como aluno

  // Alterna entre cadastro de aluno e de professor (também aceita ?tipo=professor na URL).
  function definirTipo(novo) { // Função que troca o tipo de conta exibido
    tipo = novo; // Atualiza a variável com o novo tipo
    $("tabAluno").classList.toggle("active", tipo === "aluno"); // Marca a aba Aluno como ativa só se o tipo for aluno
    $("tabProfessor").classList.toggle("active", tipo === "professor"); // Marca a aba Professor como ativa só se o tipo for professor
    $("camposAluno").hidden = tipo !== "aluno"; // Mostra os campos do aluno apenas quando o tipo for aluno
    $("camposProfessor").hidden = tipo !== "professor"; // Mostra os campos do professor apenas quando o tipo for professor
    $("linkLogin").href = tipo === "aluno" ? "login.html" : "loginProf.html"; // Ajusta o link "Entrar" conforme o tipo
    msg.hidden = true; // Esconde qualquer mensagem anterior
    form.querySelectorAll(".is-invalid").forEach(c => c.classList.remove("is-invalid")); // Remove as marcações de erro dos campos
  } // Fim da função definirTipo
  document.querySelectorAll("[data-tipo]").forEach(b => b.addEventListener("click", () => definirTipo(b.dataset.tipo))); // Faz cada aba chamar definirTipo ao ser clicada
  definirTipo(new URLSearchParams(location.search).get("tipo") === "professor" ? "professor" : "aluno"); // Ao abrir a página, usa o tipo da URL (?tipo=professor) ou aluno por padrão

  function mostrar(classe, texto) { // Função que exibe uma mensagem na caixa de alerta
    msg.className = "alert alert-" + classe; // Define a cor do alerta (success, danger etc.)
    msg.textContent = texto; // Escreve o texto da mensagem
    msg.hidden = false; // Torna a caixa visível
  } // Fim da função mostrar

  form.addEventListener("submit", async evento => { // Executa este código quando o formulário é enviado
    evento.preventDefault(); // Impede o envio padrão (que recarregaria a página)
    msg.hidden = true; // Esconde mensagens anteriores

    const vazio = id => $(id).value.trim() === ""; // Função auxiliar: retorna true se o campo estiver vazio
    const regras = { // Objeto com as regras de validação (true = campo válido)
      nome: $("nome").value.trim().split(/\s+/).length >= 2, // Nome precisa ter pelo menos duas palavras
      email: $("email").checkValidity() && !vazio("email"), // E-mail precisa ter formato válido e não estar vazio
      senha: $("senha").value.length >= 8 && $("senha").value.length <= 72, // Senha precisa ter entre 8 e 72 caracteres
      confirmarSenha: $("senha").value === $("confirmarSenha").value // Confirmação precisa ser igual à senha
    }; // Fim do objeto de regras
    if (tipo === "aluno") regras.turma = !vazio("turma"); // Se for aluno, a turma é obrigatória
    else regras.disciplina = !vazio("disciplina"); // Se for professor, a disciplina é obrigatória

    ["turma", "disciplina", ...Object.keys(regras)].forEach(id => $(id).classList.remove("is-invalid")); // Limpa as marcações de erro de todos os campos
    Object.entries(regras).forEach(([id, ok]) => $(id).classList.toggle("is-invalid", !ok)); // Marca como inválido cada campo cuja regra falhou
    if (Object.values(regras).some(ok => !ok)) { form.querySelector(".is-invalid").focus(); return; } // Se houver erro, foca o primeiro campo inválido e interrompe o envio

    const dados = { // Monta o objeto com os dados a serem enviados ao servidor
      nome: $("nome").value.trim(), email: $("email").value.trim(), // Nome e e-mail sem espaços extras nas pontas
      senha: $("senha").value // Senha digitada
    }; // Fim do objeto de dados
    const botao = form.querySelector("button[type=submit]"); // Localiza o botão "Criar conta"
    const textoBotao = botao.textContent; // Guarda o texto original do botão
    botao.disabled = true; botao.textContent = "Criando conta..."; // Desabilita o botão e mostra que está processando
    try { // Inicia o bloco que tenta enviar o cadastro
      let r; // Variável que guardará a resposta do servidor
      if (tipo === "aluno") { // Se o cadastro for de aluno
        dados.turma = $("turma").value.trim(); // Adiciona a turma aos dados
        r = await EduAPI.cadastrarAluno(dados); // Envia o cadastro do aluno e aguarda a resposta
      } else { // Caso contrário, é professor
        dados.disciplina = $("disciplina").value.trim(); // Adiciona a disciplina aos dados
        r = await EduAPI.cadastrarProfessor(dados); // Envia o cadastro do professor e aguarda a resposta
      } // Fim do if/else
      form.reset(); // Limpa os campos do formulário
      form.hidden = true; // Esconde o formulário após o sucesso
      mostrar("success", (r.mensagem || "Conta criada com sucesso!") + " Agora você já pode entrar."); // Exibe mensagem de sucesso (usa a do servidor, se existir)
      msg.append(" "); // Adiciona um espaço após a mensagem
      const a = document.createElement("a"); // Cria um link novo
      a.href = tipo === "aluno" ? "login.html" : "loginProf.html"; // Define o destino do link conforme o tipo
      a.className = "alert-link"; a.textContent = "Ir para o login"; // Aplica o estilo de link de alerta e o texto
      msg.append(a); // Insere o link dentro da mensagem de sucesso
    } catch (e) { // Se ocorrer erro no envio
      mostrar("danger", e.message); // Exibe a mensagem de erro em vermelho
    } finally { // Executa sempre, com sucesso ou erro
      botao.disabled = false; botao.textContent = textoBotao; // Reativa o botão e restaura o texto original
    } // Fim do try/catch/finally
  }); // Fim do tratamento de envio do formulário

  $("btnLimpar").addEventListener("click", () => { // Executa quando o botão "Limpar" é clicado
    form.reset(); msg.hidden = true; // Limpa os campos e esconde a mensagem
    form.querySelectorAll(".is-invalid").forEach(c => c.classList.remove("is-invalid")); // Remove as marcações de erro
    $("nome").focus(); // Coloca o cursor de volta no campo nome
  }); // Fim do tratamento do botão Limpar
</script> <!-- Fecha o script principal -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> <!-- Carrega o JavaScript do Bootstrap -->
</body> <!-- Fecha o corpo da página -->
</html> <!-- Fecha o documento HTML -->
