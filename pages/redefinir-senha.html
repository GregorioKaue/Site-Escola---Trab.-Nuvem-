<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova senha | EduConnect</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <style>
    :root {
      --primary: #2457d6;
      --bg: #f4f7fc;
    }

    body {
      background: var(--bg);
      font-family: Arial, sans-serif;
      color: #202b40;
    }

    .navbar {
      background: #fff;
    }

    .brand {
      color: var(--primary);
      font-size: 1.4rem;
      font-weight: 800;
    }

    .login-wrapper {
      min-height: calc(100vh - 140px);
    }

    .login-card {
      border: 0;
      border-radius: 20px;
      box-shadow: 0 10px 25px #243b6520;
      overflow: hidden;
    }

    .login-header {
      background: linear-gradient(120deg, #2457d6, #6489f0);
      color: white;
      padding: 28px 32px;
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 .2rem #2457d630;
    }

    .link-primary-custom {
      color: var(--primary);
      text-decoration: none;
    }

    .link-primary-custom:hover {
      text-decoration: underline;
    }

    footer {
      color: #68758a;
    }
  </style>
</head>

<body>
<nav class="navbar shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand brand" href="../index.html">EduConnect</a>
  </div>
</nav>

<main class="container py-4 login-wrapper d-flex align-items-center justify-content-center">
  <div class="card login-card w-100" style="max-width: 440px;">
    <div class="login-header">
      <h1 class="h3 fw-bold mb-1">Criar nova senha</h1>
      <p class="mb-0">Escolha uma nova senha para acessar o portal.</p>
    </div>

    <div class="card-body p-4">
      <!-- Mensagem de sucesso ou de erro (preenchida pelo JavaScript) -->
      <div id="mensagem" class="alert mb-3" role="status" hidden></div>

      <form id="formRedefinir" novalidate>
        <div class="mb-3">
          <label for="novaSenha" class="form-label fw-semibold">Nova senha</label>
          <input type="password" id="novaSenha" class="form-control form-control-lg"
            placeholder="Mínimo de 8 caracteres"
            autocomplete="new-password" minlength="8" maxlength="72" required>
          <div class="invalid-feedback">A senha deve ter de 8 a 72 caracteres.</div>
        </div>

        <div class="mb-4">
          <label for="confirmarSenha" class="form-label fw-semibold">Confirmar nova senha</label>
          <input type="password" id="confirmarSenha" class="form-control form-control-lg"
            placeholder="Repita a senha"
            autocomplete="new-password" maxlength="72" required>
          <div class="invalid-feedback">As senhas não conferem.</div>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary btn-lg">Salvar nova senha</button>
        </div>
      </form>

      <div class="text-center mt-4">
        <a href="login.html" class="link-primary-custom small">Ir para o login</a>
      </div>
    </div>
  </div>
</main>

<footer class="container text-center py-4">
  EduConnect © 2026 — Portal Digital Escolar
</footer>

<script src="api.js"></script>
<script>
  const form = document.getElementById("formRedefinir");
  const novaSenha = document.getElementById("novaSenha");
  const confirmarSenha = document.getElementById("confirmarSenha");
  const mensagem = document.getElementById("mensagem");

  // O link recebido por e-mail traz o token: .../redefinir-senha.html?token=<64 caracteres>
  const token = new URLSearchParams(window.location.search).get("token") || "";

  function mostrar(tipo, texto) {
    mensagem.className = "alert alert-" + tipo + " mb-3";
    mensagem.textContent = texto;
    mensagem.hidden = false;
  }

  // Link sem token (ou com formato errado): não adianta preencher o formulário.
  if (!/^[a-f0-9]{64}$/.test(token)) {
    mostrar("danger", "Link inválido ou expirado. Solicite uma nova recuperação de senha.");
    form.hidden = true;
  }

  form.addEventListener("submit", async evento => {
    evento.preventDefault();
    mensagem.hidden = true;

    const tamanhoOk = novaSenha.value.length >= 8 && novaSenha.value.length <= 72;
    const iguais = novaSenha.value === confirmarSenha.value;
    novaSenha.classList.toggle("is-invalid", !tamanhoOk);
    confirmarSenha.classList.toggle("is-invalid", !iguais);
    if (!tamanhoOk || !iguais) return;

    const botao = form.querySelector("button[type=submit]");
    botao.disabled = true; // Evita clique duplo enquanto a API responde
    try {
      const r = await EduAPI.redefinirSenha(token, novaSenha.value);
      mostrar("success", r.mensagem);
      form.hidden = true; // O token só vale uma vez
    } catch (e) {
      mostrar("danger", e.message);
      botao.disabled = false;
    }
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
