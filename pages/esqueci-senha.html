<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar senha | EduConnect</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <style>
    :root {
      --primary: #2457d6;
      --bg: #f4f7fc;
    }

    body {
      background: var(--bg);
      font-family: Arial, sans-serif;
      color: #202b40;
    }

    .navbar {
      background: #fff;
    }

    .brand {
      color: var(--primary);
      font-size: 1.4rem;
      font-weight: 800;
    }

    .login-wrapper {
      min-height: calc(100vh - 140px);
    }

    .login-card {
      border: 0;
      border-radius: 20px;
      box-shadow: 0 10px 25px #243b6520;
      overflow: hidden;
    }

    .login-header {
      background: linear-gradient(120deg, #2457d6, #6489f0);
      color: white;
      padding: 28px 32px;
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 .2rem #2457d630;
    }

    .link-primary-custom {
      color: var(--primary);
      text-decoration: none;
    }

    .link-primary-custom:hover {
      text-decoration: underline;
    }

    footer {
      color: #68758a;
    }
  </style>
</head>

<body>
<nav class="navbar shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand brand" href="../index.html">EduConnect</a>
  </div>
</nav>

<main class="container py-4 login-wrapper d-flex align-items-center justify-content-center">
  <div class="card login-card w-100" style="max-width: 440px;">
    <div class="login-header">
      <h1 class="h3 fw-bold mb-1">Recuperar senha</h1>
      <p class="mb-0">Informe seu e-mail e CPF para solicitar uma nova senha.</p>
    </div>

    <div class="card-body p-4">
      <form id="formRecuperar" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">E-mail</label>
          <input type="email" id="email" class="form-control form-control-lg"
            placeholder="seuemail@escola.com.br"
            autocomplete="email" required>
          <div class="invalid-feedback">Informe um e-mail válido.</div>
        </div>

        <div class="mb-3">
          <label for="cpf" class="form-label fw-semibold">CPF</label>
          <input type="text" id="cpf" class="form-control form-control-lg"
            placeholder="000.000.000-00"
            inputmode="numeric" maxlength="14"
            autocomplete="off" required>
          <div class="invalid-feedback">Informe um CPF válido.</div>
        </div>

        <div class="d-flex justify-content-end mb-4">
          <a href="login.html" class="link-primary-custom small">Voltar ao login</a>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary btn-lg">Enviar</button>
        </div>
      </form>

      <div id="mensagemSucesso" class="alert alert-success mt-4 mb-0" hidden>
        Solicitação enviada! Se os dados estiverem corretos, você receberá
        as instruções por e-mail.
      </div>
    </div>
  </div>
</main>

<footer class="container text-center py-4">
  EduConnect © 2026 — Portal Digital Escolar
</footer>

<script>
  const form = document.getElementById("formRecuperar");
  const email = document.getElementById("email");
  const cpf = document.getElementById("cpf");
  const sucesso = document.getElementById("mensagemSucesso");

  // Aplica a máscara 000.000.000-00 enquanto o usuário digita.
  cpf.addEventListener("input", () => {
    let v = cpf.value.replace(/\D/g, "").slice(0, 11);
    v = v.replace(/(\d{3})(\d)/, "$1.$2")
         .replace(/(\d{3})(\d)/, "$1.$2")
         .replace(/(\d{3})(\d{1,2})$/, "$1-$2");
    cpf.value = v;
  });

  // Valida o CPF pelos dígitos verificadores.
  function cpfValido(valor) {
    const n = valor.replace(/\D/g, "");
    if (n.length !== 11 || /^(\d)\1{10}$/.test(n)) return false;

    for (let t = 9; t < 11; t++) {
      let soma = 0;
      for (let i = 0; i < t; i++) soma += n[i] * (t + 1 - i);
      const digito = ((soma * 10) % 11) % 10;
      if (digito !== Number(n[t])) return false;
    }
    return true;
  }

  form.addEventListener("submit", evento => {
    evento.preventDefault();
    sucesso.hidden = true;

    const emailValido = email.checkValidity() && email.value.trim() !== "";
    const cpfOk = cpfValido(cpf.value);

    email.classList.toggle("is-invalid", !emailValido);
    cpf.classList.toggle("is-invalid", !cpfOk);

    if (!emailValido || !cpfOk) return;

    // O envio real deve ser integrado ao sistema da escola.
    sucesso.hidden = false;
    form.reset();
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
